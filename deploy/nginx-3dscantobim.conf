# Külön server blokk a 3dscantobim.hu-hoz.
# Csak ezt a domaint továbbítja, más site blokkját nem írja felül.
# A 3dscantobim.hu upstreamje: 127.0.0.1:7000.
# A www cím 301-gyel az apexre megy.

server {
    listen 80;
    listen [::]:80;
    server_name www.3dscantobim.hu;
    return 301 http://3dscantobim.hu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 3dscantobim.hu;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# TLS után a proxy_pass ugyanaz marad: http://127.0.0.1:7000
# A www blokk: return 301 https://3dscantobim.hu$request_uri;
# Az alkalmazás .env fájljában ilyenkor:
# SITE_URL=https://3dscantobim.hu
# TRUST_PROXY=1
# A TRUST_PROXY=1 csak akkor biztonságos, ha a 7000 kívülr?l nem érhet? el.
