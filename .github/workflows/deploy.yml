name: Deploy Site 7 to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/site-7
            git pull origin main
            npm install
            pm2 restart site-7-3dscantobim || PORT=7000 pm2 start npm --name "site-7-3dscantobim" --cwd /var/www/site-7 -- run start
            pm2 save
